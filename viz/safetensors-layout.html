<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>safetensors layout</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --ink: #1c1c1c; --dim: #6b6b66; --line: rgba(0,0,0,.18);
    --len: #2f6b3a; --hdr: #7fa886; --data: #a29d90; --fold: #d9d6cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e6e1; --dim: #9a9890; --line: rgba(255,255,255,.18);
      --len: #7fbf8e; --hdr: #4a7d55; --data: #6b6963; --fold: #3a3936;
    }
  }
  html, body { margin: 0; background: transparent; }
  body {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 15px; line-height: 1.5; color: var(--ink);
    padding: 4px 0;
  }
  /* The file reads top to bottom, in byte order. Not to scale. */
  .wrap { display: grid; grid-template-columns: 120px 1fr; grid-template-rows: 52px 60px 120px; column-gap: 18px; row-gap: 3px; }
  .file {
    grid-row: 1 / 4; position: relative; display: grid; grid-template-rows: subgrid;
    clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
    border-radius: 4px;
  }
  .file::after { /* folded corner */
    content: ""; position: absolute; top: 0; right: 0; width: 26px; height: 26px;
    background: linear-gradient(225deg, transparent 50%, var(--fold) 50%);
  }
  .len { background: var(--len); }
  .hdr { background: var(--hdr); }
  .data { background: var(--data); }
  .file .data {
    background-image: repeating-linear-gradient(180deg, transparent 0 9px, rgba(255,255,255,.18) 9px 10px);
    background-color: var(--data);
  }
  .lab { align-self: center; display: flex; gap: 10px; align-items: flex-start; }
  .lab::before { content: ""; flex: none; width: 14px; height: 0; margin-top: .75em; border-top: 1px solid var(--line); margin-left: -18px; }
  .lab b { display: block; font-weight: 600; }
  .lab span { color: var(--dim); font-size: 13px; }
  .sz { font-style: normal; white-space: nowrap; }
  .tot { margin-top: 14px; color: var(--dim); }
  .tot b { color: var(--ink); }
</style>
</head>
<body>
  <!-- GPT-2 124M model.safetensors: 8 + 14,283 + 548,090,880 = 548,105,171 bytes. -->
  <div class="wrap">
    <div class="file"><div class="len"></div><div class="hdr"></div><div class="data"></div></div>
    <div class="lab"><div><b>header length</b><span>one 64-bit integer <i class="sz">(8 bytes)</i></span></div></div>
    <div class="lab"><div><b>header</b><span>JSON map of tensors <i class="sz">(~14 KB)</i></span></div></div>
    <div class="lab"><div><b>weights</b><span>raw numbers, back to back <i class="sz">(~548 MB)</i></span></div></div>
  </div>
  <div class="tot"><code>model.safetensors</code>: <b>~548 MB</b> · not to scale</div>
</body>
</html>
